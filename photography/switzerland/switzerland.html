<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>switzerland</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: black;
            color: white;
            line-height: 1.6;
            padding: 100px 40px;
            font-size: 18px;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .content {
            max-width: 800px;
            text-align: left;
            width: 100%;
        }
        .header {
            margin-bottom: 40px;
            font-size: 18px;
            letter-spacing: -1px;
        }
        .gallery-container {
            position: relative;
            margin-bottom: 20px;
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gallery-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
        .gallery-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 20px;
        }
        .nav-button {
            background: none;
            border: none;
            color: white;
            font-family: 'Times New Roman', Times, serif;
            font-size: 18px;
            cursor: pointer;
            padding: 10px 20px;
            transition: opacity 0.3s;
        }
        .nav-button:hover {
            opacity: 0.7;
        }
        .nav-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .photo-counter {
            font-size: 18px;
            
        }
        .back-link {
            display: block;
            margin-top: 40px;
            font-size: 18px;
            text-decoration: none;
            color: white;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            body {
                padding: 60px 20px;
            }
            .nav-button {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="header">
            switzerland
        </div>
        
        <div class="gallery-container">
            <img id="galleryImage" src="IMG_6940.jpeg" alt="Switzerland" class="gallery-image">
        </div>
        
        <div class="gallery-nav">
            <button id="prevBtn" class="nav-button">previous</button>
            <div class="photo-counter">
                <span id="currentPhoto">1</span> / <span id="totalPhotos">19</span>
            </div>
            <button id="nextBtn" class="nav-button">next</button>
        </div>
        
        <a href="../../photography.html" class="back-link">back</a>
    </div>

    <script>
        const images = [
            'IMG_6940.jpeg',
            'IMG_0834_Original.JPG',
            'IMG_5229_Original.JPG',
            'IMG_7579.jpeg',
            'IMG_0934_Original.JPG',
            'IMG_7075.jpeg',
            'IMG_7108.jpeg',
            'IMG_7120.jpeg',
            'IMG_7187.jpeg',
            'IMG_7191.jpeg',
            'IMG_7256.jpeg',
            'IMG_7275.jpeg',
            'IMG_7413.jpeg',
            'IMG_7427.jpeg',
            'IMG_7632.jpeg',
            'IMG_2701_Original.JPG',
            'IMG_7686.jpeg',
            'IMG_2886_Original.JPG',
            'IMG_6853_Original.JPG',
            'IMG_7920.jpeg',
            'IMG_7941.jpeg',
            'IMG_8107.jpeg',
        ];

        let currentIndex = 0;
        const galleryImage = document.getElementById('galleryImage');
        const currentPhoto = document.getElementById('currentPhoto');
        const totalPhotos = document.getElementById('totalPhotos');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        totalPhotos.textContent = images.length;

        function updateGallery() {
            galleryImage.src = images[currentIndex];
            currentPhoto.textContent = currentIndex + 1;
            
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === images.length - 1;
        }

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateGallery();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < images.length - 1) {
                currentIndex++;
                updateGallery();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                prevBtn.click();
            } else if (e.key === 'ArrowRight') {
                nextBtn.click();
            }
        });

        updateGallery();
    </script>
</body>
</html>
